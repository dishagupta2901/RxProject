services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports: ["5173:80"]
    depends_on: [api]
  api:
    build:
      context: ..
      dockerfile: src/RxFlow.Api/Dockerfile
    environment:
      ConnectionStrings__RxFlow: Host=postgres;Port=5432;Database=rxflow;Username=rxflow;Password=rxflow
      Persistence__ApplyMigrations: "true"
    ports: ["5080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rxflow
      POSTGRES_USER: rxflow
      POSTGRES_PASSWORD: rxflow
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rxflow -d rxflow"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
  redpanda:
    image: redpandadata/redpanda:v24.3.6
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--reserve-memory", "0M", "--check=false", "--node-id", "0", "--kafka-addr", "PLAINTEXT://0.0.0.0:9092", "--advertise-kafka-addr", "PLAINTEXT://localhost:9092"]
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --api-urls localhost:9644"]
      interval: 10s
      timeout: 5s
      retries: 10
